name: Daily CinemAgent Scraper

on:
  schedule:
    # 05:00 UTC is 08:00 AM Tel Aviv Time (IDT, Daylight Saving) 
    # and 07:00 AM Tel Aviv Time (IST, Standard Time)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CinemAgent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python src/run.py
